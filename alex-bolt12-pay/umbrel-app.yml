releaseNotes: |
  Adds full BOLT12 support via LNDK.

  ⚠️ IMPORTANT:
  BOLT12 requires onion messaging in LND.

  If BOLT12 offers do not work, add the following to your Lightning node config:

    [protocol]
    custom-message=513
    custom-nodeann=39
    custom-init=39

  Then restart your Lightning node.

  Improvements:
  • Stable LNDK startup handling
  • Better compatibility after Umbrel reboot
  • Improved payment reliability
