  Mobile scanner:

  - Adds two-finger pinch-to-zoom for a Phoenix-style scanning workflow
  - Keeps the visible zoom slider as an accessible one-handed alternative
  - Prevents a completed pinch gesture from accidentally triggering tap-to-focus
  - Retains the larger camera preview and QR target for dense BOLT12 Offer codes

  Zap notifications continue to use the restored encrypted NIP-04 self-DM flow from version 0.3.3.5.

