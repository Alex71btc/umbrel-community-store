releaseNotes: |
  Improves UI stability and internationalization across the app.

  • Fixes inconsistent language switching (DE/EN) in multiple UI sections
  • Eliminates flickering and race conditions in alias list rendering
  • Restores and stabilizes toast notification system with unified translation keys
  • Fixes LNURL and Alias Manager texts not updating correctly without page reload
  • Improves overall responsiveness and consistency of the Pay interface

  This release significantly improves the user experience, especially on mobile and during interactive use.
