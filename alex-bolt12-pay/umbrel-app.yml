releaseNotes: |
  Major UX and onboarding upgrade with bilingual UI and improved reliability.

  • Full English + German interface with live language switching
  • New Setup flow for initial configuration (BOLT12 + LNURL + DNS)
  • Improved remote access model (separates admin UI from public payment endpoints)
  • Fixed QR code initialization and refresh issues
  • Improved payment summaries for BOLT12, BOLT11 and LNURL
  • Language-aware timestamps in Offer History (auto-switch)
  • Cleaner Nostr Identity and Cloudflare BIP353 configuration UI
  • Unified translation system (removed hardcoded strings)
  • Unified toast system across all actions
  • Tap-to-copy for QR codes, strings, and buttons
  • Fixed button states during async actions (Create Offer, Save Identity)
  • General stability improvements and bug fixes
dependencies:
  - lightning
path: ""
defaultUsername: ""
defaultPassword: ""
torOnly: false
